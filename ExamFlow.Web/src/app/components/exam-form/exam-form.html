<div class="min-h-screen bg-gray-100 py-8 px-4 font-sarabun">
  <div class="max-w-xl mx-auto">
    <div class="bg-white rounded-2xl shadow-md overflow-hidden">

      <div class="bg-green-500 px-6 py-4 flex items-center justify-between">
        <h1 class="text-white text-lg font-semibold">
          {{ isEditMode ? 'แก้ไขข้อสอบ' : 'IT 08-2' }}
        </h1>
        <span class="text-green-100 text-sm">
          {{ isEditMode ? 'แก้ไข' : 'เพิ่มข้อสอบ' }}
        </span>
      </div>

      <div class="p-6">
        <form [formGroup]="form" (ngSubmit)="save()" novalidate class="space-y-4">

          @for (field of fields; track field.key) {
            <div class="flex items-start gap-3">
              <label
                [for]="field.key"
                class="w-24 shrink-0 text-sm font-medium text-gray-600 pt-2.5 text-right"
              >
                {{ field.label }}
              </label>
              <div class="flex-1">
                <input
                  [id]="field.key"
                  [formControlName]="field.key"
                  [placeholder]="field.placeholder"
                  type="text"
                  class="w-full px-3 py-2.5 text-sm rounded-lg border outline-none
                         transition-all duration-150 placeholder:text-gray-300"
                  [class.border-gray-300]="!isInvalid(field.key)"
                  [class.border-red-400]="isInvalid(field.key)"
                  [class.bg-red-50]="isInvalid(field.key)"
                />
                @if (isInvalid(field.key)) {
                  <p class="mt-1 text-xs text-red-500">กรุณากรอก{{ field.label }}</p>
                }
              </div>
            </div>
          }

          <div class="flex items-start gap-3">
            <label class="w-24 shrink-0 text-sm font-medium text-gray-600 pt-2.5 text-right">
              เฉลย
            </label>
            <div class="flex-1">
              <select
                formControlName="correctAnswer"
                class="w-full px-3 py-2.5 text-sm rounded-lg border border-gray-300
                       outline-none focus:border-green-400 focus:ring-2 focus:ring-green-100
                       transition-all duration-150 bg-white"
                required
              >
                <option [value]="1">คำตอบ 1</option>
                <option [value]="2">คำตอบ 2</option>
                <option [value]="3">คำตอบ 3</option>
                <option [value]="4">คำตอบ 4</option>
              </select>
              <p class="mt-1 text-xs text-gray-400">เลือกข้อที่ถูกต้อง</p>
            </div>
          </div>

  
          <div class="bg-green-50 border border-green-200 rounded-lg px-4 py-3">
            <p class="text-xs text-green-600 font-medium mb-1">✅ เฉลยที่เลือก</p>
            <p class="text-sm text-green-700 font-semibold">{{ previewAnswer }}</p>
          </div>

          <div class="border-t border-gray-100 pt-5 mt-2">
            <div class="flex justify-center gap-3">
              <button
                type="submit"
                [disabled]="isSaving()"
                class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700
                       active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed
                       text-white text-sm font-medium px-8 py-2.5 rounded-lg
                       transition-all duration-150 shadow-sm"
              >
                @if (isSaving()) {
                  <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
                  </svg>
                  กำลังบันทึก...
                } @else {
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                  </svg>
                  บันทึก
                }
              </button>

              <button
                type="button"
                (click)="cancel()"
                class="inline-flex items-center gap-2 bg-red-500 hover:bg-red-600
                       active:scale-95 text-white text-sm font-medium px-8 py-2.5
                       rounded-lg transition-all duration-150 shadow-sm"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
                ยกเลิก
              </button>
            </div>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
